# Draft manifest of the GC3 AI SAST Toolkit, as the runner depends on it.
#
# Status: draft (step 1 of issue #2). Nothing reads this file yet.
#
# This file holds paths, IDs, order and content hashes only. It must never
# contain toolkit prompt text. See docs/adr/0001-runner-separate-from-toolkit.md
# and docs/toolkit-workflow.md.
#
# Hashes are SHA-256 of the raw file bytes, as `sha256sum` prints them.
# Every file tracked in the toolkit is listed, so a new, changed or deleted
# file is always visible to drift detection. `role` says how much a change
# matters to the runner:
#   stage               a staged prompt the runner sends to the model
#   one-shot            the single-prompt fallback the runner sends to the model
#   agent-instructions  root instructions the runner sends to the model
#   reporting           templates and standards the reporting step depends on
#   reference           human guidance; the runner does not send or parse it

manifest_version = 0

# The toolkit has no tags or releases yet (checked 2026-10-27), so this copy
# is identified by commit and file hashes. Add `release` once releases exist.
# Hashes, not the commit or release, decide staleness.
[toolkit]
repository = "https://github.com/uk-gov-cyber/GC3-AI-SAST-Toolkit"
commit = "0ec2ffe363346ece896173e92b49a6cc595d9c73"
hash_algorithm = "sha256"

# Stage IDs are the file stems. The toolkit has no stable stage IDs of its
# own (see "Open questions" in docs/toolkit-workflow.md).

[[stages]]
id = "00-run-control-and-evidence-model"
mode = "staged"
order = 0
path = "1-prompts/staged/00-run-control-and-evidence-model.md"
mandatory = true
depends_on = []

[[stages]]
id = "01-repo-triage-prompt"
mode = "staged"
order = 1
path = "1-prompts/staged/01-repo-triage-prompt.md"
mandatory = true
