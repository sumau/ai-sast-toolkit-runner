[project]
name = "ai-sast-toolkit-runner"
version = "0.1.0"
description = "Unofficial CLI runner for the GC3 AI SAST Toolkit workflow."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sast-run = "ai_sast_toolkit_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sast_toolkit_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
